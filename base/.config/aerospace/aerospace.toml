# AeroSpace Configuration
# Based on your Hyprland dotfiles
# All main bindings use 'alt' (Option) to mimic 'SUPER' but avoid conflicting with native macOS Cmd keys.

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Gaps (Set to 0 to match your hyprland gaps_in = 0, gaps_out = 0)
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

[mode.main.binding]
# --- Launch Apps ---
alt-enter = 'exec-and-forget open -n -a Ghostty'
alt-b = 'exec-and-forget open -a Zen'
alt-n = 'exec-and-forget open -a "Standard Notes"'
alt-s = 'exec-and-forget open -a Signal'
# Raycast owns Option+R as its native global hotkey.
alt-e = 'exec-and-forget open ~'          # Open Finder in home directory (your File Manager)
alt-slash = 'exec-and-forget open ~/.config/aerospace/aerospace.toml' # Help / Cheat Sheet

# Consume Alt+V before macOS turns it into “√”, then invoke Paste directly.
alt-v = 'exec-and-forget ~/.config/aerospace/paste.sh'

# --- Window Management ---
alt-f = 'layout floating tiling'         # Toggle floating
alt-j = 'layout horizontal vertical'     # Toggle split direction (closest to dwindle togglesplit)

# --- Split Keyboard Layout Overlay (mirrors Hyprland Super+K hold/release → toggle) ---
# Hyprland: bind = Super, K → show | bindrt = Super, K → hide (hold-to-show)
# AeroSpace: alt-k toggles (show if hidden, hide if showing) on the focused monitor
alt-k = 'exec-and-forget ~/.config/hypr/scripts/split_keeb_layout_mac.sh toggle'

# --- Focus Movement (Arrow Keys) ---
alt-left = 'focus left'
alt-right = 'focus right'
alt-up = 'focus up'
alt-down = 'focus down'

# --- Window Movement ---
alt-shift-left = 'move left'
alt-shift-right = 'move right'
alt-shift-up = 'move up'
alt-shift-down = 'move down'

# --- Move Focused Window to Monitor ---
alt-ctrl-left = 'move-node-to-monitor --wrap-around next'
alt-ctrl-right = 'move-node-to-monitor --wrap-around prev'
alt-ctrl-up = 'move-node-to-monitor --wrap-around next'
alt-ctrl-down = 'move-node-to-monitor --wrap-around prev'

# --- Move Current Workspace to Monitor ---
# Moves the entire workspace, not just the focused window.
alt-ctrl-shift-left = 'move-workspace-to-monitor --wrap-around left'
alt-ctrl-shift-right = 'move-workspace-to-monitor --wrap-around right'
alt-ctrl-shift-up = 'move-workspace-to-monitor --wrap-around up'
alt-ctrl-shift-down = 'move-workspace-to-monitor --wrap-around down'

# --- Workspaces ---
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'


[workspace-to-monitor-force-assignment]
1 = ['DELL P3425WE', 'Built-in Display']
2 = ['DELL P3425WE', 'Built-in Display']
3 = ['DELL P3425WE', 'Built-in Display']
4 = ['DELL P3425WE', 'Built-in Display']
5 = ['LG HDR 4K', 'Built-in Display']
6 = ['LG HDR 4K', 'Built-in Display']
7 = ['LG HDR 4K', 'Built-in Display']
8 = ['LG HDR 4K', 'Built-in Display']
9 = ['Built-in Display']

# --- Move to Workspace ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# --- Scratchpad (Magic Workspace in Hyprland) ---
alt-m = 'workspace magic'
alt-shift-m = 'move-node-to-workspace magic'

# ---------------------------------------------------------------------------
# Window Rules
# Mirrors Hyprland windowrulev2: float, pin, noanim, noborder for kb-overlay
# 'ignore' removes it from AeroSpace workspace management → stays on all workspaces
# ---------------------------------------------------------------------------
[[on-window-detected]]
if.window-title-regex-substring = 'kb-overlay'
run = 'layout floating'
